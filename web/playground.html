<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141414" />
    <link rel="canonical" href="https://openrscad.com/playground" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <title>OpenRSCAD Playground — model in OpenSCAD, right in your browser</title>
    <meta
      name="description"
      content="The OpenRSCAD playground: write OpenSCAD in a modern editor with live preview and a native-speed geometry engine — no install, runs in your browser."
    />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpenRSCAD" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://openrscad.com/playground" />
    <meta
      property="og:title"
      content="OpenRSCAD Playground — model in OpenSCAD, right in your browser"
    />
    <meta
      property="og:description"
      content="Write OpenSCAD in a modern editor with live preview and a native-speed geometry engine — no install, runs in your browser."
    />
    <meta property="og:image" content="https://openrscad.com/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="OpenRSCAD — OpenSCAD, reimagined for speed. A model renders in 53 ms versus 19 s in OpenSCAD."
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="OpenRSCAD Playground — model in OpenSCAD, right in your browser"
    />
    <meta
      name="twitter:description"
      content="Write OpenSCAD in a modern editor with live preview and a native-speed geometry engine — no install, runs in your browser."
    />
    <meta name="twitter:image" content="https://openrscad.com/og.png" />
    <meta
      name="twitter:image:alt"
      content="OpenRSCAD — OpenSCAD, reimagined for speed. A model renders in 53 ms versus 19 s in OpenSCAD."
    />
    <script>
      // Set the theme attribute before first paint so a light-mode OS doesn't
      // flash the dark default for a frame. App.tsx keeps this in sync after.
      document.documentElement.dataset.theme = window.matchMedia(
        "(prefers-color-scheme: dark)",
      ).matches
        ? "dark"
        : "light";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
