<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" role="img" aria-label="OpenRSCAD logo">
  <!-- Mark + wordmark for use on DARK backgrounds (light ink). The wordmark is
       set in Schibsted Grotesk (the site's display face) with a grotesque
       fallback where that font isn't installed. -->
  <path d="M14 14h24v12h12v24H14z" fill="#e6e8ec"/>
  <text x="80" y="32" dominant-baseline="central" fill="#e6e8ec"
        font-family="'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif"
        font-size="34" font-weight="700" letter-spacing="-0.01em">OpenRSCAD</text>
</svg>
