name: Release desktop app

# Builds and uploads the desktop installers and the standalone CLI binaries for
# an ALREADY-CREATED GitHub Release. Two entry points:
#
#   1. changesets (the normal path). Merging the "Version Packages" PR bumps the
#      tree's version; changesets.yml then cuts the tag + Release and dispatches
#      this workflow with `--ref <tag> -f tag=<tag>`. The `release: published`
#      trigger below does NOT fire for that Release: GitHub suppresses workflow
#      triggers from GITHUB_TOKEN-authored events.
#   2. `release: published` (escape hatch), which still fires when a HUMAN
#      publishes a Release by hand. A manual `workflow_dispatch` also re-runs a
#      build against any existing tag.
#
# The version is NOT stamped here any more. changesets + scripts/sync-versions.mjs
# own every version-bearing file in the repo, so the commit this tag points at
# already carries the right version in tauri.conf.json — which feeds both the
# installer version and the updater manifest. The step below only ASSERTS that,
# so a hand-cut tag cannot silently ship a mismatched installer.
#
# The in-app updater reads
#   https://github.com/matthova/openrscad/releases/latest/download/latest.json
# and every download link (README, landing page, in-app callout) reads
# releases/latest/download/<stable-name>; both resolve to the release marked
# "Latest". Assets attach AFTER the Release exists, so changesets.yml creates it
# NOT-latest and the `promote` job below marks it Latest only once every leg has
# uploaded. Until then the links keep serving the previous release.
#
# Required repository secrets (see docs/RELEASING.md):
#   TAURI_SIGNING_PRIVATE_KEY           — minisign private key (updater signing)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — its password
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#                                       — macOS Developer ID signing + notarization

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v0.1.0 (must already exist)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    # A changesets-cut Release arrives here only via workflow_dispatch. If an
    # App/PAT token is ever put on changesets.yml, its Release would ALSO fire
    # the `release: published` trigger and race this dispatch — 8 matrix jobs
    # contending for the same assets and latest.json. Ignore bot-authored release
    # events so only the dispatch path runs.
    if: >-
      github.event_name != 'release' ||
      github.event.release.author.login != 'github-actions[bot]'
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS is built per-arch on native runners rather than as one
          # universal binary: openrscad-geom links the native Manifold C++ kernel,
          # whose CMake build only produces the runner's host arch, so a
          # cross-compiled `universal-apple-darwin` fails to link the x86_64
          # slice. macos-latest is Apple Silicon; macos-15-intel is Intel (the
          # x86_64 replacement after GitHub retired the macos-13 image in Dec
          # 2025 — available until Aug 2027, after which hosted Intel macOS goes
          # away entirely). Each emits its own updater entry (darwin-aarch64 /
          # darwin-x86_64) in latest.json.
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust-targets: "aarch64-apple-darwin"
            # Stable, version-less alias uploaded alongside the versioned .dmg so
            # the README can link releases/latest/download/<name> permanently.
            bundle-glob: "desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg"
            stable-name: "OpenRSCAD-macos-aarch64.dmg"
            # The .app the .dmg and updater .app.tar.gz are built from; its code
            # signature is verified after the build (see the macOS step below).
            app-glob: "desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app"
          - platform: macos-15-intel
            args: "--target x86_64-apple-darwin"
            rust-targets: "x86_64-apple-darwin"
            bundle-glob: "desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg"
            stable-name: "OpenRSCAD-macos-x64.dmg"
            app-glob: "desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app"
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
            # AppImage is the only self-updating Linux format, so that's what the
            # download table links; .deb/.rpm stay reachable via the release page.
            bundle-glob: "desktop/src-tauri/target/release/bundle/appimage/*.AppImage"
            stable-name: "OpenRSCAD-linux-x86_64.AppImage"
          - platform: windows-latest
            args: ""
            rust-targets: ""
            bundle-glob: "desktop/src-tauri/target/release/bundle/nsis/*-setup.exe"
            stable-name: "OpenRSCAD-windows-x64-setup.exe"

    runs-on: ${{ matrix.platform }}
    # Serialize per-platform against the same tag so a hand-published Release and
    # an in-flight dispatch can't both build the same leg and race on asset
    # upload / latest.json. Keyed by platform so the matrix still parallelizes.
    concurrency:
      group: release-desktop-${{ matrix.platform }}-${{ github.event.release.tag_name || inputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the TAGGED commit on every trigger. changesets.yml dispatches
          # with `--ref <tag>` so this is already right, but a hand-dispatch from
          # the Actions UI defaults the ref to main — pin it explicitly.
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          # openrscad-geom builds the native Manifold C++ kernel; the BOSL2 corpus
          # submodule isn't needed to bundle, so a shallow checkout is fine.
          submodules: false

      # changesets owns the version now: the tagged commit already carries it in
      # tauri.conf.json, which is what feeds the installer version and the updater
      # manifest (latest.json). Nothing is stamped here — this only asserts tag
      # and file agree, so a hand-cut tag can't ship an installer labelled with a
      # different version than the Release it attaches to.
      - name: Assert tauri.conf.json matches the release tag
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          VERSION="${TAG#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+].+)?$'; then
            echo "::error::Release tag '$TAG' is not a valid vX.Y.Z semver tag."
            exit 1
          fi
          IN_REPO=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          if [ "$IN_REPO" != "$VERSION" ]; then
            echo "::error::tauri.conf.json is $IN_REPO but the tag says $VERSION. Versions are owned by changesets; tags cut by hand must point at a commit whose version already matches."
            exit 1
          fi
          echo "tauri.conf.json version = $IN_REPO matches tag $TAG."

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo (release)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: cargo-release-${{ matrix.platform }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}

      # The native Manifold C++ kernel (openrscad-geom -> manifold-csg-sys) needs cmake.
      - name: Install cmake
        uses: lukka/get-cmake@latest

      # Tauri v2's Linux bundler needs the webkit / gtk / appindicator stack.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            libxdo-dev \
            build-essential \
            file wget

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        shell: bash

      # The desktop build's beforeBuildCommand runs `npm --prefix ../web run
      # build:wasm && build`, but it does NOT install the web deps first — do it
      # here so the wasm + vite build can run.
      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # Provides the @tauri-apps/cli that tauri-action invokes.
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      # Resolve the existing Release's numeric id so tauri-action uploads INTO it
      # rather than reconciling it. See the `releaseId` note on the next step.
      # Fails loudly if the Release is missing, instead of silently creating a
      # second one under the same tag.
      - name: Resolve release id
        id: rel
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id)
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            echo "::error::No GitHub Release exists for tag $TAG. Cut it with changesets (merge the Version Packages PR) or publish one by hand first."
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "Uploading assets to release id $ID ($TAG)."

      - name: Build, sign, and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          # tauri-action creates the GitHub Release via the API and needs a token
          # with `contents: write` (granted in the job `permissions` above).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (minisign). Without these the updater artifacts are
          # unsigned and the app refuses them.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # ---- macOS code-signing + notarization (see RELEASING.md) ----
          # The bundler imports the Developer ID certificate into a temporary
          # keychain, signs the .app with the hardened runtime, submits it to
          # Apple's notary service, waits, and staples the ticket to the .app
          # before building the .dmg and the updater .app.tar.gz from it. A
          # notarized download opens with no Gatekeeper warning.
          # APPLE_SIGNING_IDENTITY overrides the ad-hoc identity "-" in
          # tauri.conf.json (bundle.macOS.signingIdentity), which is only the
          # fallback for local builds. The bundler does NOT fail when the
          # notarization credentials are missing — it warns and ships a signed but
          # un-notarized app — so the verify step below checks for the ticket.
          # Ignored on the Windows and Linux legs.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # desktop/ holds package.json; tauri finds src-tauri/tauri.conf.json.
          projectPath: desktop
          # Pass releaseId, NOT tagName. tauri-action only reconciles the Release
          # when `tagName && !releaseId` (src/index.ts) — and that path calls
          # updateRelease, which would replace the CHANGELOG notes and title that
          # changesets.yml wrote with the one-liner below, on every matrix leg.
          # Giving it an id skips creation entirely and goes straight to asset
          # upload, leaving the Release body that changesets.yml generated intact.
          releaseId: ${{ steps.rel.outputs.id }}
          # Still used as the `notes` field of latest.json (the updater manifest),
          # which is what the in-app update banner shows.
          releaseBody: "See the assets below to download and install OpenRSCAD."
          # Emits latest.json (the updater manifest) alongside the installers.
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # Each release .app must be (1) validly signed, (2) signed with the
      # Developer ID rather than the ad-hoc fallback, and (3) notarized with
      # the ticket stapled. These are three separate failure modes:
      #   1. No bundle signature at all (what v0.14.1 and earlier shipped):
      #      macOS calls the download "damaged and can't be opened", with no
      #      way past it.
      #   2. Ad-hoc only (APPLE_SIGNING_IDENTITY missing): "Apple could not
      #      verify…", and users have to click Open Anyway in System Settings.
      #   3. Signed but not notarized (APPLE_ID/PASSWORD/TEAM_ID missing): the
      #      same dialog, and the bundler only warns, so nothing else catches it.
      # Fail the leg on any of them. (Runs after the upload because tauri-action
      # builds and uploads in one step; a red job is the signal.)
      - name: Verify macOS signature and notarization
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          app=$(ls -d ${{ matrix.app-glob }} 2>/dev/null | head -n1)
          if [ -z "$app" ]; then
            echo "::error::No .app matched ${{ matrix.app-glob }}"; exit 1
          fi
          info=$(codesign -dv --verbose=2 "$app" 2>&1 || true)
          echo "$info" | grep -E '^(Format|CodeDirectory|Signature|Authority|TeamIdentifier|Sealed Resources|Runtime Version)' || true
          if ! codesign --verify --deep --strict --verbose=2 "$app"; then
            echo "::error::$app has no valid code signature — macOS would report the download as damaged."
            exit 1
          fi
          if [[ "$info" != *"Authority=Developer ID Application:"* ]]; then
            echo "::error::$app is not signed with a Developer ID (ad-hoc fallback?). Check the APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY secrets."
            exit 1
          fi
          if ! xcrun stapler validate "$app"; then
            echo "::error::$app has no stapled notarization ticket. Check the APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID secrets and the notarization output of the build step."
            exit 1
          fi
          echo "$app: Developer ID signed and notarized."

      # tauri-action names installers with the version embedded
      # (OpenRSCAD_0.0.4_aarch64.dmg), so there's no stable URL to link from a static
      # README. Upload a version-less COPY of this platform's installer to the
      # same release so releases/latest/download/<stable-name> always resolves to
      # the newest build. --clobber keeps manual re-runs idempotent. Runs after
      # the build above, so the bundle exists and the release already has assets.
      - name: Upload stable-named alias
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          src=$(ls ${{ matrix.bundle-glob }} 2>/dev/null | head -n1)
          if [ -z "$src" ]; then
            echo "::error::No bundle matched ${{ matrix.bundle-glob }}"; exit 1
          fi
          cp "$src" "${{ matrix.stable-name }}"
          gh release upload "$TAG" "${{ matrix.stable-name }}" --clobber --repo "$GITHUB_REPOSITORY"

  # Prebuilt `openrscad` CLI binaries, so installing the CLI doesn't need a
  # Rust + CMake toolchain (scripts/install.sh downloads these). Same triggers
  # and bot guard as the desktop job; runs in parallel with it and uploads into
  # the same Release.
  #
  # Asset names carry no version (openrscad-cli-<target>.tar.gz + .sha256), so
  # releases/latest/download/<name> always resolves to the newest build — the
  # same reason the desktop job uploads `stable-name` aliases.
  cli:
    if: >-
      github.event_name != 'release' ||
      github.event.release.author.login != 'github-actions[bot]'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runner per arch, for the same reason as the desktop matrix:
          # Manifold's CMake build only produces the runner's host arch.
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-15-intel
            target: x86_64-apple-darwin
          # 22.04 is the oldest hosted Ubuntu, so the binary gets the lowest
          # glibc floor available (2.35).
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}
    concurrency:
      group: release-cli-${{ matrix.target }}-${{ github.event.release.tag_name || inputs.tag }}
      cancel-in-progress: false
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      ASSET: openrscad-cli-${{ matrix.target }}.tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          submodules: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Same guard as the desktop job, against the crate the binary is built
      # from, so `openrscad --version` always matches the Release it ships in.
      - name: Assert openrscad-cli version matches the release tag
        shell: bash
        run: |
          IN_REPO=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "openrscad-cli") | .version')
          if [ "$IN_REPO" != "${TAG#v}" ]; then
            echo "::error::openrscad-cli is $IN_REPO but the tag says $TAG."
            exit 1
          fi

      - name: Cache cargo (cli)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-cli-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      # The native Manifold C++ kernel (openrscad-geom -> manifold-csg-sys) needs cmake.
      - name: Install cmake
        uses: lukka/get-cmake@latest

      - name: Build
        env:
          # Debug symbols are most of the binary's size and no use to end users.
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: cargo build --release --locked -p openrscad-cli --target ${{ matrix.target }}

      # Render a real model before publishing anything, so a binary that builds
      # but can't run (missing dylib, wrong arch) never reaches the Release.
      - name: Smoke test
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/openrscad
          "$bin" --version
          "$bin" examples/cyl.scad -o "$RUNNER_TEMP/cyl.stl"
          test -s "$RUNNER_TEMP/cyl.stl"

      - name: Package and upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar -czf "$ASSET" \
            -C target/${{ matrix.target }}/release openrscad \
            -C "$GITHUB_WORKSPACE" LICENSE-APACHE LICENSE-MIT
          shasum -a 256 "$ASSET" > "$ASSET.sha256"
          gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber --repo "$GITHUB_REPOSITORY"

  # Mark the Release "Latest" once every installer and CLI binary is attached.
  # changesets.yml creates it with --latest=false, so until this runs,
  # releases/latest keeps serving the previous complete release. A Release
  # marked Latest before its assets exist 404s every download link, the
  # updater's latest.json and scripts/install.sh. `needs` waits for both whole
  # matrices, so one failed leg leaves the previous release as Latest.
  # Re-running the failed jobs also re-runs this one.
  promote:
    needs: [release, cli]
    runs-on: ubuntu-latest
    # Two releases cut close together each promote. Serialize them so the
    # version check below and the edit can't interleave and leave the OLDER one
    # as Latest.
    concurrency:
      group: release-promote
      cancel-in-progress: false
    steps:
      - name: Mark the release Latest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          PRE=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)
          if [ "$PRE" = "true" ]; then
            echo "$TAG is a prerelease; GitHub never marks those Latest."
            exit 0
          fi
          # A hand-dispatched rebuild of an older tag must not take Latest away
          # from a newer release. (gh api prints the error body on a 404, e.g.
          # no Latest release at all, so discard its output on failure.)
          CURRENT=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null) || CURRENT=""
          if [ "$CURRENT" = "$TAG" ]; then
            echo "$TAG is already Latest."
            exit 0
          fi
          NEWEST=$(printf '%s\n%s\n' "${CURRENT#v}" "${TAG#v}" | sort -V | tail -n1)
          if [ -n "$CURRENT" ] && [ "$NEWEST" != "${TAG#v}" ]; then
            echo "Latest is $CURRENT, which is newer than $TAG; leaving it."
            exit 0
          fi
          gh release edit "$TAG" --latest --repo "$GITHUB_REPOSITORY"
          echo "Marked $TAG Latest (was ${CURRENT:-none})."
