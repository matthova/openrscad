name: Publish engine to npm

# Publishes the `@taulabs/openrscad-engine` npm package (the wasm build of
# crates/openrscad-wasm) for an ALREADY-CREATED GitHub Release. The package name
# is read from packages/npm/package.json, never hardcoded. Two entry points:
#
#   1. changesets (the normal path). changesets.yml dispatches this workflow with
#      `--ref <tag> -f tag=<tag>` right after it cuts the Release. The
#      `release: published` trigger below does NOT fire for that Release — GitHub
#      suppresses workflow triggers from GITHUB_TOKEN-authored events, and
#      workflow_dispatch is the documented exception.
#   2. `release: published` / manual dispatch (escape hatch), for a
#      hand-published Release or a re-publish against an existing tag.
#
# Auth is npm Trusted Publishing (OIDC) — there is NO NPM_TOKEN. npm's trusted
# publisher config matches org + repo + WORKFLOW FILENAME only; it has no event,
# branch or ref field, so publishing under workflow_dispatch is fully supported
# and the registration below is unchanged. On a public repo, provenance (a
# sigstore attestation shown on the npm page) is emitted automatically.
#
# The version is NOT stamped here any more — changesets + scripts/sync-versions.mjs
# own [workspace.package] version and packages/npm/package.json, so the tagged
# commit already carries the right version (this is also what makes the wasm's
# version() truthful, since it compiles in CARGO_PKG_VERSION). The step below
# only ASSERTS tag and tree agree.
#
# BOOTSTRAP (this fork): DONE. @taulabs/openrscad-engine@0.11.0-beta.0 was
# published by hand so the package would exist, and the trusted publisher is
# registered — npmjs.com > @taulabs/openrscad-engine > Settings > Trusted
# Publisher > GitHub Actions, with Organization or user = taucad, Repository =
# openrscad, Workflow filename = publish-npm.yml, Environment blank, Allowed
# actions = npm publish. Those fields are case-sensitive and exact, and renaming
# this file breaks the match. `publishConfig.provenance` is back on, so every
# release from here carries a sigstore attestation; that only works from CI, so
# a publish from a laptop now fails by design.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build & publish, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write # upload the packed .tgz as a release asset
  id-token: write # OIDC for Trusted Publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    # Ignore bot-authored release events: a changesets-cut Release reaches this
    # workflow via dispatch. If an App/PAT token is ever put on changesets.yml its
    # Release would also fire `release: published`, and two concurrent runs would
    # both pass the "already published?" check before either publishes, leaving
    # the loser with a red E403.
    if: >-
      github.event_name != 'release' ||
      github.event.release.author.login != 'github-actions[bot]'
    # Belt and braces: serialize any two runs targeting the same tag.
    concurrency:
      group: release-npm-${{ github.event.release.tag_name || inputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the TAGGED commit on both triggers. On workflow_dispatch the
          # default ref is the branch you dispatched from, so pin it explicitly —
          # otherwise provenance would attest a build that isn't the tag.
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          submodules: false

      - name: Resolve version + dist-tag from the release tag
        id: ver
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          V="${TAG#v}"
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+].+)?$'; then
            echo "::error::Release tag '$TAG' is not a valid vX.Y.Z semver tag."
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # A prerelease tag (0.2.0-rc.1) publishes under `next` so it never
          # clobbers the `latest` dist-tag that plain `npm install` resolves.
          # Matched with `case`, not `grep -q '-'`: a lone `-` is not reliably
          # parsed as a pattern, which silently sends prereleases to `latest`.
          case "$V" in
            *-*) echo "npmtag=next" >> "$GITHUB_OUTPUT" ;;
            *)   echo "npmtag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Install Rust (wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs a recent npm.
      - name: Update npm
        run: npm install -g npm@latest

      # changesets owns the versions, so the tagged commit already carries them —
      # no stamping. Assert instead: the wasm compiles CARGO_PKG_VERSION into
      # version(), and package.json becomes the published version, so a mismatch
      # here would ship a package whose version() disagrees with its own manifest.
      - name: Assert in-repo versions match the release tag
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          # Parse the TOML rather than grepping it: single-quoted for bash, and
          # containing no `$`, so nothing here is subject to shell expansion.
          CARGO=$(python3 -c 'import tomllib;print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')
          PKG=$(node -p "require('./packages/npm/package.json').version")
          fail=0
          [ "$CARGO" = "$V" ] || { echo "::error::Cargo.toml [workspace.package] version is $CARGO but the tag says $V."; fail=1; }
          [ "$PKG" = "$V" ]   || { echo "::error::packages/npm/package.json is $PKG but the tag says $V."; fail=1; }
          if [ "$fail" -ne 0 ]; then
            echo "Versions are owned by changesets. Cut releases by merging the Version Packages PR, not by tagging by hand."
            exit 1
          fi
          echo "Cargo.toml and packages/npm/package.json both report $V."

      - name: Build wasm targets (web + node) and the TS facade
        working-directory: packages/npm
        shell: bash
        run: |
          wasm-pack build ../../crates/openrscad-wasm --release --target web \
            --out-dir "$PWD/pkg/web" --out-name openrscad
          wasm-pack build ../../crates/openrscad-wasm --release --target nodejs \
            --out-dir "$PWD/pkg/node" --out-name openrscad
          # wasm-pack writes a `.gitignore` containing `*` into each out-dir;
          # npm honors it and would silently drop the wasm from the tarball.
          rm -f pkg/web/.gitignore pkg/node/.gitignore
          npm install
          npm run build:facade

      # No `npm version` step: changesets already wrote the version into
      # package.json, and the assertion above proved it matches the tag.

      - name: Publish to npm (idempotent)
        working-directory: packages/npm
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          # Read the name rather than hardcoding it: this fork publishes under a
          # scope, and a stale literal here would check the wrong package and
          # publish over the top of a green "already published" log line.
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$V" version >/dev/null 2>&1; then
            echo "$NAME@$V already on the registry — skipping publish."
            exit 0
          fi
          # The check above is inherently racy (two runs can both pass it), so
          # treat "someone else published it first" as success rather than a
          # spurious red E403.
          npm publish --tag "${{ steps.ver.outputs.npmtag }}" || {
            if npm view "$NAME@$V" version >/dev/null 2>&1; then
              echo "Lost a publish race; $NAME@$V is present. Treating as success."
            else
              echo "::error::npm publish failed and $NAME@$V is not on the registry."
              exit 1
            fi
          }

      - name: Smoke-check provenance
        working-directory: packages/npm
        continue-on-error: true
        run: npm audit signatures || true

      - name: Attach packed tarball to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd packages/npm
          TGZ=$(npm pack 2>/dev/null | tail -n1)
          # Stable-named alias so a static link (releases/latest/download/...) always
          # resolves to the newest engine tarball, matching the desktop convention.
          cp "$TGZ" openrscad-engine.tgz
          gh release upload "${{ github.event.release.tag_name || inputs.tag }}" \
            "$TGZ" openrscad-engine.tgz --clobber --repo "$GITHUB_REPOSITORY"
