# Standalone workspace: keeps the heavy Tauri dependency tree out of the main
# Rust workspace (and CI), while still depending on the openrscad crates by path.
[workspace]

[package]
name = "openrscad-desktop"
version = "0.13.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "OpenRSCAD desktop app (Tauri) — native OpenSCAD-compatible renderer"
rust-version = "1.85"

[lib]
name = "openrscad_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "openrscad-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Opens external URLs (e.g. the GitHub link) in the system browser.
tauri-plugin-opener = "2"
# In-app auto-update: `updater` pulls the signed release manifest and installs
# the platform artifact; `process` provides `relaunch` after an update lands.
# Desktop-only — the updater has no meaning on mobile targets.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
# Carries imported binary meshes (binary STL/3MF) between the frontend and the
# native engine as standard base64 — matching the browser's byte channel.
base64 = "0.22"

openrscad-syntax = { path = "../../crates/openrscad-syntax" }
openrscad-eval = { path = "../../crates/openrscad-eval" }
openrscad-geom = { path = "../../crates/openrscad-geom" }

# macOS "Open in application": enumerate the apps Launch Services associates
# with a file type (NSWorkspace + UTType). Other platforms use no native APIs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSWorkspace",
    "objc2-uniform-type-identifiers",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSArray",
    "NSURL",
] }
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = [
    "std",
    "UTType",
] }

[profile.release]
opt-level = 3
lto = "thin"
