[package]
name = "openrscad-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
openrscad-syntax = { workspace = true }
openrscad-ir = { workspace = true }
thiserror = { workspace = true }
rustc-hash = { workspace = true }
ttf-parser = { workspace = true }
png = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Font database: bundled Liberation is always loaded (deterministic default);
# hosts may additionally register OS fonts (native) or font bytes (browser).
# wasm gets no filesystem features; native enables mmap + fontconfig below.
fontdb = { version = "0.24", default-features = false, features = ["std"] }
rustybuzz = "0.20.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fontdb = { version = "0.24", default-features = false, features = [
    "std",
    "fs",
    "memmap",
    "fontconfig",
] }
